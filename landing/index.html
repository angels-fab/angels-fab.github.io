<!doctype html>
<!--
  ANGELS 포털 — 로그인 전 첫 화면(알갱이 로고 · 조감도 · 하늘 · 날씨 · 계절). 2026-11-21 시안 42를 옮긴 것이고, 이제 이 파일이 원본이다.
  · 포털의 src/pages/Landing 이 화면 가득 iframe 으로 띄운다. 로그인 · 가입 신청 · 다음 화면은 window.parent.__angelsLanding 으로 포털에 넘긴다.
  · 고칠 때는 /landing/index.html?lab 으로 따로 열면 시안 조작 줄(날씨 · 계절 · 시간 · 로그인 결과)이 나온다. 그냥 열면 포털로 돌려보낸다.
  · tests/visual/compare.mjs 가 이 화면으로 로그인한다 — 로그인 창의 role=dialog · 라벨 "사번" · "비밀번호" · 버튼 이름 "로그인"을 바꾸지 말 것.
  · 날씨 · 미세먼지는 오픈메테오(열쇠 없음, 광주 좌표만 보냄). 사용자가 고른 것 · 퇴짜 놓은 것은 Claude 메모리 login-landing-particles 참조.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANGELS 통합업무포털</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #0a0a0a; --ink: #f2f4f9; --muted: #9aa2b3; --line: rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; touch-action: none;
    font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }

  /* 무대 — 검은 바탕에 별(알갱이)과 마우스 빛만 */
  .view { position: fixed; inset: 0; overflow: hidden; perspective: 1600px; perspective-origin: 50% 50%; }
  .scene { position: absolute; inset: 0; z-index: 2; transform-origin: 50% 50%; will-change: transform; }
  #sky { position: absolute; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; }   /* 하늘과 해를 그리는 판 — 알갱이 뒤 */
  #cld { position: absolute; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; }   /* 구름 — 낮은 해상도로 그려 늘인다(부드러워서 티가 안 난다) */
  #wxf { position: absolute; inset: 0; z-index: 3; display: block; width: 100%; height: 100%; pointer-events: none; transition: opacity .35s; }   /* 알갱이 앞을 지나는 빗줄기 · 눈송이 몇 개 */
  body.dlg #wxf { opacity: 0; }
  #dust { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; }   /* 미세먼지 — 하늘을 덮는 뿌연 막 */
  #wx { position: absolute; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; pointer-events: none; }   /* 비 · 눈 · 바람에 날리는 먼지 · 번개 줄기 */
  .scene canvas { position: absolute; display: block; pointer-events: none; }
  .flash { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 46%, rgba(228,232,255,.95), rgba(130,125,255,.5) 45%, rgba(10,10,10,0) 78%); }
  .flash.on { animation: flash 1.5s ease-out forwards; }
  @keyframes flash { 0% { opacity: 0; } 22% { opacity: .85; } 100% { opacity: 0; } }

  /* 가운데 — 로고 자리(.slot)와 조감도 자리(.bslot)는 빈 칸이고(폭이 같다), 알갱이가 그 칸을 찾아가 그려진다 */
  .stage { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; pointer-events: none; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 22px; --lw: min(30.24vw, calc(448px + max(0px, (100vw - 1481px) * .14))); --bw: min(37.8vw, calc(560px + max(0px, (100vw - 1481px) * .175))); }
  .slot { width: var(--lw); aspect-ratio: 720 / 132; }
  .bslot { width: var(--bw); aspect-ratio: 1274 / 372; }
  /* '통합업무포털' — 두 버튼의 머리글(조감도 아래, 조감도 폭). 메인으로 돌아올 때는 알갱이가 거의 다 모인 뒤에 뜬다 */
  .portal { display: flex; align-items: center; gap: 16px; width: var(--bw); margin: 0 0 -10px; font-size: 13px; font-weight: 500; letter-spacing: .5em; color: rgba(236,240,255,.66); transition: opacity .3s .38s; }
  .portal::before, .portal::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.17); opacity: 0; }
  body.in .portal::before, body.in .portal::after { animation: rise .5s 1.35s forwards; }
  body.done .portal::before, body.done .portal::after { opacity: 1; animation: none; }
  .portal b { font-weight: inherit; white-space: nowrap; }
  .portal span:last-child { letter-spacing: 0; }
  .portal span { display: inline-block; opacity: 0; filter: blur(9px); translate: 0 8px; }
  body.in .portal span { animation: letter .5s calc(1.35s + var(--i) * 50ms) cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes letter { to { opacity: 1; filter: blur(0); translate: 0 0; } }
  @keyframes rise { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
  @media (max-width: 860px) { .hero { --lw: 69vw; --bw: 86vw; gap: 24px; } }

  /* 갈림길 버튼 — 조감도 아래, 두 버튼을 합친 폭 = 조감도 폭. 왼쪽 포털 로그인 · 오른쪽 체험관 */
  .fork { display: flex; gap: 10px; width: var(--bw); margin-top: 2px; }
  .enter { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: clamp(44px, calc(var(--bw) * .081), 56px); border-radius: 10px; border: 1px solid rgba(255,255,255,.34); background: rgba(255,255,255,.05);
    color: var(--ink); font-size: clamp(15px, calc(var(--bw) * .027), 18px); font-weight: 600; letter-spacing: .08em; font-family: inherit; white-space: nowrap; cursor: pointer; pointer-events: auto; opacity: 0;
    transition: opacity .3s .38s, background .2s, border-color .2s, color .2s, scale .12s; }
  .enter:active { scale: .98; background: rgba(255,255,255,.18); }
  .enter.try:active { background: rgba(110,168,255,.26); }
  .enter svg { flex: none; width: 20px; height: 20px; fill: currentColor; }
  body.in .enter { animation: rise .6s 1.5s forwards; }
  body.in .enter.try { animation-delay: 1.6s; }
  .enter:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.62); }
  .enter.try { border-color: rgba(110,168,255,.55); background: rgba(110,168,255,.08); color: #a9cbff; }
  .enter.try:hover { background: rgba(110,168,255,.18); border-color: rgba(110,168,255,.85); }

  /* 로그인 창 — 테두리 · 입력 칸 · 버튼 틀은 알갱이가 그리고, 글자와 입력만 여기 얹는다(칸 자리는 알갱이 그림과 같은 숫자) */
  .card { position: fixed; left: 50%; top: 46%; width: 380px; height: 304px; translate: -50% -50%; z-index: 30; opacity: 0; pointer-events: none; transition: opacity .26s; }
  body.dlg .card { opacity: 1; pointer-events: auto; transition: opacity .28s .3s; }
  body:not(.lite) .card { text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .card > * { position: absolute; margin: 0; }
  .card h2 { left: 24px; top: 18px; display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600; }
  .card h2 svg { width: 20px; height: 20px; fill: currentColor; }
  .card .desc { left: 24px; top: 56px; width: 332px; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .card label { left: 24px; font-size: 12px; font-weight: 600; color: #d4d4d4; }
  .card input { left: 24px; width: 332px; height: 38px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); font-size: 14px; font-family: inherit; outline: none; }
  .join { left: 24px; top: 273px; font-size: 13px; color: var(--muted); }
  .err { left: 24px; top: 197px; font-size: 12px; color: #ff9c9c; opacity: 0; transition: opacity .2s; }
  body.bad .err { opacity: 1; }
  .join .link { margin-left: 6px; padding: 2px; border: 0; border-radius: 4px; background: none; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(255,255,255,.35); text-underline-offset: 3px; }
  .join .link:hover { text-decoration-color: #fff; }
  .join .link:focus-visible { outline: none; text-decoration-color: #fff; text-decoration-thickness: 2px; }
  @media (max-width: 768px) { .card input { font-size: 16px; } }   /* 아이폰은 입력 글자가 16px 보다 작으면 누를 때 화면을 확대한다 */
  .btn { top: 220px; height: 40px; padding: 0; border: 0; border-radius: 8px; background: transparent; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
  /* 로그인 버튼 — 판으로 채우지 않는다(알갱이 화면과 따로 논다). 입력 칸은 가는 네모 테두리, 버튼은 굵고 밝은 알약 모양 테두리 + 바깥 빛으로 알갱이만으로 구별한다 */
  .btn.solid { left: 24px; width: 332px; border-radius: 20px; color: #fff; font-weight: 700; letter-spacing: .1em; text-shadow: 0 0 6px #000, 0 0 2px #000; transition: opacity .2s, scale .12s; }
  .btn.solid:active { scale: .985; }
  .btn.ghost { left: 312px; top: 268px; width: 44px; height: 28px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); }
  .btn.ghost:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  /* 기다리는 동안 — 다시 누르지 못하게 */
  body.wait .card input, body.wait .btn { pointer-events: none; }
  body.wait .btn.solid { opacity: .55; }
  /* 4 키보드로 옮길 때의 초점 표시 — 브라우저 기본 테두리 대신 화면에 맞는 빛 */
  .enter:focus-visible { outline: none; border-color: rgba(255,255,255,.8); background: rgba(255,255,255,.12); }
  .enter.try:focus-visible { border-color: rgba(169,203,255,.95); background: rgba(110,168,255,.2); }
  .btn:focus-visible { outline: none; }   /* 로그인 버튼의 초점은 알갱이 테두리가 밝아지는 것으로 보인다 */
  body.lite .btn.solid:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 2px; }   /* 정지 그림일 때만 선으로 */
  /* 5 움직임 줄이기를 켠 PC — 글자 · 버튼도 움직이지 않고 바로 보인다(알갱이는 정지 그림) */
  body.rm .portal span, body.rm .enter, body.rm .portal::before, body.rm .portal::after { animation: none !important; opacity: 1; filter: none; translate: 0 0; }
  body.rm .next { scale: 1; transition: opacity .25s; }
  /* 휴대폰 — 알갱이가 없으니 창을 보통 모양으로 그린다 */
  body.lite .card { background: rgba(20,20,22,.94); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 30px 70px -24px rgba(0,0,0,.9); max-width: calc(100vw - 16px); }
  body.lite .card input { border: 1px solid rgba(255,255,255,.17); background: rgba(10,11,16,.8); }
  body.lite .btn.solid { background: #f5f5f5; color: #111; text-shadow: none; }

  /* 등장 연출이 끝난 뒤 · 로그인 창이 떴을 때 · 넘어갈 때 */
  body.done .portal span { opacity: 1; filter: none; translate: 0 0; animation: none; }
  body.done .enter { opacity: 1; animation: none; }
  body.dlg .portal, body.dlg .enter, body.gone .portal, body.gone .enter { opacity: 0 !important; pointer-events: none; transition: opacity .2s; }
  body.gone .card { opacity: 0 !important; transition: opacity .2s; }

  /* 다음 화면(임시 그림) — 진입 장면 끝에 페이드로 뜬다. 실제로는 이 자리에 포털 · 체험관 화면이 온다 */
  .next { position: fixed; inset: 0; z-index: 35; display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto 1fr; opacity: 0; scale: .94; pointer-events: none; background: #0f1013;
    transition: opacity .55s cubic-bezier(.3,0,.2,1), scale .95s cubic-bezier(.16,1,.3,1); }
  body.arrived .next { opacity: 1; scale: 1; }
  .nx-band { grid-column: 1 / -1; height: 0; background: #2f6fed; }
  body.booth .nx-band { height: 36px; }
  .nx-side { background: #15171c; border-right: 1px solid rgba(255,255,255,.06); }
  .nx-main { display: flex; flex-direction: column; gap: 18px; min-height: 0; padding: 28px 40px; }
  .nx-main i { display: block; border: 1px solid rgba(255,255,255,.06); border-radius: 12px; background: #17191f; }
  .nx-h { width: 220px; height: 30px; border-radius: 8px; background: #1b1e25; }
  .nx-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; } .nx-row i { height: 110px; }
  .nx-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; min-height: 0; }
  .nx-cap { position: absolute; left: 50%; top: 50%; translate: -50% -50%; padding: 8px 16px; border: 1px dashed rgba(255,255,255,.25); border-radius: 10px; background: rgba(12,12,12,.8); color: var(--muted); font-size: 13px; white-space: nowrap; }

  /* ── 시간대 하늘 — 바탕 빛은 .view 에 직접 칠한다(JS 가 시각에 맞춰 넣는다). --day = 낮의 밝은 정도(0 밤 ~ 1 한낮) ── */
  .view::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: #05060b; opacity: 0; transition: opacity .45s; }
  body.dlg .view::before { opacity: calc(var(--day, 0) * .32); }   /* 로그인 창이 뜨면 밝은 하늘을 어둡게 눌러 창의 글자가 또렷하게 */
  body.sky .portal { color: rgba(236,240,255, calc(.58 + .36 * var(--day, 0))); text-shadow: 0 1px 10px rgba(4,12,30, calc(var(--day, 0) * .55)); }
  body.p4.sky .enter { background: linear-gradient(rgba(6,12,26, calc(var(--day, 0) * .36)), rgba(6,12,26, calc(var(--day, 0) * .36))), rgba(255,255,255,.035); }
  body.p4.sky .enter:hover { background: linear-gradient(rgba(6,12,26, calc(var(--day, 0) * .3)), rgba(6,12,26, calc(var(--day, 0) * .3))), rgba(255,255,255,.1); }
  body.p4.sky .enter.try { background: linear-gradient(rgba(6,12,26, calc(var(--day, 0) * .4)), rgba(6,12,26, calc(var(--day, 0) * .4))), rgba(110,168,255,.08); }
  body.p4.sky .enter.try:hover { background: linear-gradient(rgba(6,12,26, calc(var(--day, 0) * .34)), rgba(6,12,26, calc(var(--day, 0) * .34))), rgba(110,168,255,.18); }
  .bar input[type=range] { width: 170px; accent-color: #cfd6ee; }
  .bar .todv { min-width: 44px; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ── 다듬기(시안 조작 줄에서 하나씩 켜고 끈다) ── */
  /* 1 글씨 결 — 가늘게, 자간을 넓게 */
  body.p1 .portal { font-weight: 400; letter-spacing: .66em; color: rgba(236,240,255,.58); }
  body.p1 .enter { font-weight: 500; letter-spacing: .16em; }
  body.p1 .card h2 { font-size: 17px; font-weight: 500; letter-spacing: .06em; }
  body.p1 .card h2 svg { width: 17px; height: 17px; }
  body.p1 .card label { font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--muted); }
  body.p1 .card input { letter-spacing: .03em; }
  body.p1 .btn.solid { font-weight: 600; letter-spacing: .22em; }
  body.p1 .join, body.p1 .btn.ghost { font-size: 12px; letter-spacing: .02em; }
  /* 2 화면 깊이 — 가장자리는 어둡게, 로고 뒤에는 아주 옅은 빛 */
  body.p2 .view::before, body.p2 .view::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  body.p2 .view::before { background: radial-gradient(ellipse 46% 40% at 50% 47%, rgba(120,130,200,.14), rgba(120,130,200,0) 72%); }
  body.p2 .view::after { background: radial-gradient(ellipse 78% 74% at 50% 48%, rgba(0,0,0,0) 50%, rgba(0,0,0,.56) 100%); }
  /* 4 유리 같은 메인 버튼 — 가늘고 옅은 테두리, 반투명 바탕, 올리면 안쪽에서 밝아진다 */
  body.p4 .enter { border-radius: 12px; border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.035); }
  body.p4 .enter:hover { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.085); }
  body.p4 .enter.try { border-color: rgba(120,172,255,.4); background: rgba(110,168,255,.06); }
  body.p4 .enter.try:hover { border-color: rgba(140,186,255,.75); background: rgba(110,168,255,.14); }
  .seg.multi button[aria-pressed="false"] { color: #7f8798; }

  /* 시안 조작 줄 — 실제 화면에는 없다 */
  .bar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 12px; padding: 7px 14px;
    border: 1px dashed rgba(255,255,255,.22); border-radius: 12px; background: rgba(12,12,12,.86); font-size: 12px; color: var(--muted); white-space: nowrap; flex-wrap: wrap; justify-content: center; row-gap: 8px; max-width: calc(100vw - 16px); }
  .bar .tag { font-weight: 700; color: var(--ink); }
  .bar { left: 8px; right: 8px; transform: none; width: fit-content; margin: 0 auto; }
  .bar .grp { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .bar .wxlive { color: var(--ink); white-space: nowrap; } .bar .wxlive:empty { display: none; }
  @media (max-width: 860px) { .bar { flex-wrap: wrap; justify-content: center; width: calc(100vw - 16px); } }
  .seg { display: inline-flex; overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; }
  .seg button { padding: 6px 10px; border: 0; background: transparent; color: #cdd2de; font-size: 12px; font-family: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #f2f4f9; color: #0c0e14; font-weight: 700; }
  .again { padding: 6px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: transparent; color: #cdd2de; font-size: 12px; font-family: inherit; cursor: pointer; }

  /* ── 포털에 끼운 판(src/pages/Landing 이 iframe 으로 띄운다) ── */
  body:not(.lab) .bar { display: none; }   /* 조작 줄은 ?lab 으로 따로 열었을 때만 */
  body.host .next { display: none; }   /* 다음 화면 임시 그림 — 포털이 뒤에서 뜨므로 안 쓴다 */
  .leave { position: fixed; inset: 0; z-index: 34; pointer-events: none; opacity: 0; background: #0a0a0a; transition: opacity .32s cubic-bezier(.3,0,.2,1); }   /* 진입 장면 끝 — 다음 화면(포털 · 체험관)의 바탕색으로 덮은 뒤에 넘긴다(다음 화면을 그리는 동안 장면이 한가운데서 멈춘 채 보이지 않게). 시안의 임시 그림(.next)은 이 위에 뜬다 */
  body.leaving .leave { opacity: 1; }
  body.rm .leave { transition-duration: .25s; }
  .card { visibility: hidden; transition: opacity .26s, visibility 0s .26s; }   /* 닫힌 로그인 창의 칸에 탭으로 들어가지 않게 */
  body.dlg .card { visibility: visible; transition: opacity .28s .3s, visibility 0s; }
  body.gone .card { transition: opacity .2s, visibility 0s .2s; }
  .err { width: 332px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="view">
  <canvas id="sky"></canvas>
  <canvas id="cld"></canvas>
  <canvas id="wx"></canvas>
  <div id="dust"></div>
  <div class="scene" id="scene">
    <canvas id="fx"></canvas>
    <canvas id="gl"></canvas>
  </div>
  <canvas id="wxf"></canvas>
</div>
