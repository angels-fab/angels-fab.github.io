<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: iOS 사파리의 '작은 입력창 포커스 시 자동 확대' 방지(입력 글자를 16px로
         키우던 테마 규칙의 대체 — 사용자 손가락 핀치 줌은 iOS 10+ 에서 이 값과 무관하게 항상 됨) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <script>
      try {
        if (localStorage.getItem('forceDesktop') === '1') {
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1280')
        }
      } catch (e) {}
      // 테마 초기 세팅 — 앱 렌더 전에 <html data-theme>를 확정해 다크→라이트 깜빡임(FOUC) 방지
      try {
        var t = localStorage.getItem('angels-theme')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 홈 화면에 추가(PWA) — 아이폰은 설치된 상태에서만 웹푸시가 온다(iOS 16.4+) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ANGELS" />
    <meta name="theme-color" content="#0F1117" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <!-- 손글씨(데모결과 코멘트 종이 테마) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" />
    <title>통합업무포털</title>
    <script type="module" crossorigin src="/assets/index-Bf6W5HDM.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CKC-ABBf.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
